# Workflow for building and deploying a Nuxt site to GitHub Pages
#
# To get started with Nuxt see: https://nuxtjs.org/docs/get-started/installation
# To deploy a Nuxt app to GitHub Pages see: https://nuxt.com/deploy/github-pages
#
name: Deploy Nuxt site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["gh_pages"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
  # Allow to cleanup deployed environments
  deployments: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Remove previously deployed environment
  cleanup_deployment_history:
    name: Cleanup Deployment History
    runs-on: ubuntu-latest
    steps:
      - name: Delete Previous Deployments
        uses: strumwolf/delete-deployment-environment@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          environment: github-pages
          onlyRemoveDeployments: true

  # Build job
  build:
    needs: cleanup_deployment_history
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24.22.0"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      # Note: actions/configure-pages@v5 is for Nuxt2 only
      #- name: Setup Pages
      #  uses: actions/configure-pages@v5
      #  with:
      #    # Automatically inject router.base in your Nuxt configuration file and set
      #    # target to static (https://nuxtjs.org/docs/configuration-glossary/configuration-target/).
      #    #
      #    # You may remove this line if you want to manage the configuration yourself.
      #    static_site_generator: nuxt

      - name: Restore cache
        uses: actions/cache@v5
        with:
          path: |
            .output
            .nuxt
          key: ${{ runner.os }}-nuxt-build-${{ hashFiles('.output') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-build-

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Static HTML export with Nuxt
        run: |
          echo "NUXT_APP_BASE_URL: ${NUXT_APP_BASE_URL}"
          npx nuxt build --preset github_pages
        env:
          # If there is no domain assigned to this repos GH pages,
          # then set NUXT_APP_BASE_URL=/<repository>/
          NUXT_APP_BASE_URL: /${{ github.event.repository.name }}/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./.output/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
